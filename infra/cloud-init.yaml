#cloud-config
# Cloud-init voor een NIEUWE PoetsPloeg-server bij Hetzner (Ubuntu 26.04).
#
# Waarom dit bestand: de huidige server (178.104.225.130) is ooit aangemaakt met de
# cloud-init van het ERP. Hetzner draait user-data bij elke *Rebuild* opnieuw, en dat zou de
# gebruiker erp, een oude sleutel en de hostnaam erp-productie terugzetten. User-data is bij
# een bestaande server niet te wijzigen. Daarom: nooit Rebuild, maar een nieuwe server met
# dit bestand. Die krijgt wel een nieuw IP-adres (DNS, UITROL_HOST en UITROL_HOSTSLEUTEL
# bijwerken).
#
# Dit bestand beschrijft de toestand van 10-11-2026. Pas het aan als je op de server iets
# met de hand verandert.
#
# VOOR GEBRUIK: zet de publieke sleutel van Thomas hieronder bij users -> thomas.

hostname: poetsploeg
fqdn: poetsploeg
preserve_hostname: false
timezone: Europe/Amsterdam

package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-v2
  - ufw
  - unattended-upgrades
  - curl
  - restic

users:
  - name: thomas
    groups: [docker]
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - "VUL-HIER-DE-PUBLIEKE-SLEUTEL-VAN-THOMAS-IN (inhoud van id_ed25519.pub)"
  - name: uitrol
    system: true
    homedir: /home/uitrol
    groups: [docker]
    shell: /bin/bash
    lock_passwd: true
    # Uitrolsleutel van GitHub Actions; mag alleen het ontvangstscript starten.
    ssh_authorized_keys:
      - 'restrict,command="/usr/local/sbin/poetsploeg-ontvang" ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDJIcmu0qIqIWo63IvYF1Ik21FC80wTKVs1aOSjfClQ5 github-actions-poetsploeg'

write_files:
  # 00- wint, want sshd houdt de eerste waarde aan die hij tegenkomt.
  - path: /etc/ssh/sshd_config.d/00-poetsploeg.conf
    permissions: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no

  - path: /etc/sudoers.d/thomas
    permissions: "0440"
    content: |
      thomas ALL=(ALL) NOPASSWD:ALL

  - path: /etc/sysctl.d/90-swappiness.conf
    content: |
      vm.swappiness=10

  - path: /etc/apt/apt.conf.d/52poetsploeg-upgrades
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:30";

  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

  # Kopie van infra/server/poetsploeg-ontvang (CI controleert dat ze gelijk zijn).
  - path: /usr/local/sbin/poetsploeg-ontvang
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Vast ontvangstscript voor de uitrolsleutel van GitHub Actions.
      # Geïnstalleerd als /usr/local/sbin/poetsploeg-ontvang (root:root, 755) en afgedwongen via
      #   restrict,command="/usr/local/sbin/poetsploeg-ontvang" ssh-ed25519 ... github-actions-poetsploeg
      # in /home/uitrol/.ssh/authorized_keys. De sleutel kan dus alleen dit script starten:
      # geen shell, geen port forwarding.
      #
      # Waarom zo klein: dit script verandert bijna nooit en wordt met de hand geïnstalleerd.
      # Het echte werk staat in scripts/server/uitrol.sh, en dat nemen we uit de commit die
      # uitgerold wordt. Bij het vorige project draaide de server de vorige versie van zijn
      # eigen uitrolscript, omdat hij dat uit de oude checkout haalde.
      #
      # Toegestaan (SSH_ORIGINAL_COMMAND):
      #   ping                 -> "ok poetsploeg", om de sleutel en de hostsleutel te testen
      #   uitrol <40-hex-sha>  -> stdin is een tar (git archive) van die commit
      #   onderhoud <taak>     -> een benoemde taak uit scripts/server/onderhoud.sh (huidige release)
      set -euo pipefail
      umask 027

      BASIS=/opt/poetsploeg
      read -r actie arg rest <<<"${SSH_ORIGINAL_COMMAND:-}" || true

      weiger() { echo "geweigerd: $*" >&2; exit 2; }
      [ -z "${rest:-}" ] || weiger "te veel argumenten"

      # Eén uitrol of onderhoudstaak tegelijk; de lock blijft open over de exec heen.
      exec 9>"$BASIS/.lock"
      flock -w 900 9 || weiger "er loopt al een uitrol of taak"

      case "${actie:-}" in
        ping)
          echo "ok poetsploeg"
          ;;
        uitrol)
          [[ "${arg:-}" =~ ^[0-9a-f]{40}$ ]] || weiger "uitrol verwacht een volledige commit-sha"
          doel="$BASIS/releases/$arg"
          tmp=$(mktemp -d "$BASIS/releases/.ontvang.XXXXXX")
          trap 'rm -rf "$tmp"' EXIT
          tar -x --no-same-owner -C "$tmp"
          [ -f "$tmp/scripts/server/uitrol.sh" ] || weiger "scripts/server/uitrol.sh ontbreekt in de commit"
          rm -rf "$doel"
          mv "$tmp" "$doel"
          trap - EXIT
          exec bash "$doel/scripts/server/uitrol.sh" "$arg"
          ;;
        onderhoud)
          [[ "${arg:-}" =~ ^[a-z][a-z-]{0,30}$ ]] || weiger "ongeldige taaknaam"
          [ -f "$BASIS/huidig/scripts/server/onderhoud.sh" ] || weiger "nog geen release uitgerold"
          exec bash "$BASIS/huidig/scripts/server/onderhoud.sh" "$arg"
          ;;
        *)
          weiger "onbekende opdracht"
          ;;
      esac

runcmd:
  - [sh, -c, ": > /root/.ssh/authorized_keys"]
  - [sh, -c, "fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab"]
  - [sysctl, --system]
  - [ufw, default, deny, incoming]
  - [ufw, default, allow, outgoing]
  - [ufw, allow, 22/tcp]
  - [ufw, allow, 80/tcp]
  - [ufw, allow, 443/tcp]
  - [ufw, --force, enable]
  - [install, -d, -o, uitrol, -g, uitrol, -m, "750", /opt/poetsploeg, /opt/poetsploeg/releases]
  - [systemctl, restart, ssh]
