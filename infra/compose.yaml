# Productie op de server. Gestart door scripts/server/uitrol.sh met:
#   docker compose -p poetsploeg -f <release>/infra/compose.yaml \
#     --env-file /opt/poetsploeg/.env --env-file <release>/infra/productie.env ...
# De projectnaam staat vast (poetsploeg), zodat de volumes bij elke release dezelfde blijven,
# ook al staat elke release in een eigen map.
#
# Lokaal ontwikkelen gaat met docker-compose.yml in de hoofdmap, niet met dit bestand.
name: poetsploeg

x-app: &app
  build:
    context: ..
    dockerfile: docker/productie/Dockerfile
    target: app
    args:
      POETSPLOEG_COMMIT: ${POETSPLOEG_COMMIT:-onbekend}
  image: poetsploeg-app:latest
  # Eerst de geheimen van de server, dan de instellingen uit git (die winnen).
  # In CI wijst POETSPLOEG_ENV naar een voorbeeldbestand om de compose-config te testen.
  env_file:
    - ${POETSPLOEG_ENV:-/opt/poetsploeg/.env}
    - productie.env
  environment:
    # Vast voor deze opzet; hoeft dus niet in .env.
    APP_ENV: production
    APP_DEBUG: "false"
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: "3306"
    LOG_CHANNEL: stderr
    SESSION_DRIVER: database
    SESSION_SECURE_COOKIE: "true"
    CACHE_STORE: database
    QUEUE_CONNECTION: sync
  volumes:
    - bestanden:/var/www/poetsploeg/storage/app
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  app:
    <<: *app

  scheduler:
    <<: *app
    # Zelfde image als app; niet nog een keer bouwen.
    build: !reset null
    pull_policy: never
    command: ["php", "artisan", "schedule:work"]

  db:
    image: mysql:26.10
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE ontbreekt}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME ontbreekt}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD ontbreekt}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD ontbreekt}
      TZ: Europe/Amsterdam
    volumes:
      - dbdata:/var/lib/mysql
    # Geen poort naar buiten: alleen app en scheduler praten met de database.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    logging: *logging

  web:
    build:
      context: ..
      dockerfile: docker/productie/Dockerfile
      target: web
    image: poetsploeg-web:latest
    environment:
      POETSPLOEG_DOMEIN: ${POETSPLOEG_DOMEIN:?POETSPLOEG_DOMEIN ontbreekt}
    # Alleen TCP: HTTP/3 staat uit in de Caddyfile (zie daar waarom).
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
    logging: *logging

volumes:
  dbdata:
  bestanden:
  caddy_data:
  caddy_config:
