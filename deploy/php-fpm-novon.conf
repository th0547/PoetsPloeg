; /etc/php/8.3/fpm/pool.d/novon.conf
; Eigen pool: draait als gebruiker "novon", zodat Novon en getbolster.nl elkaars bestanden niet kunnen lezen.
; Na plaatsen: sudo php-fpm8.3 -t && sudo systemctl reload php8.3-fpm

[novon]
user = novon
group = novon

listen = /run/php/novon.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Bescheiden instellingen: een planningstool voor een handvol gebruikers.
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 30s
pm.max_requests = 500

php_admin_value[open_basedir] = /var/www/novon:/tmp:/usr/share/php
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 12M
php_admin_value[memory_limit] = 256M
php_admin_flag[expose_php] = off
php_admin_value[error_log] = /var/www/novon/storage/logs/php-fpm.log
php_admin_flag[log_errors] = on
