# /etc/nginx/sites-available/poetsploeg
# Activeren: sudo ln -s /etc/nginx/sites-available/poetsploeg /etc/nginx/sites-enabled/poetsploeg
# Daarna:    sudo nginx -t && sudo systemctl reload nginx && sudo certbot --nginx -d poetsploeg.thomasklaassen.nl
# certbot voegt zelf het 443-blok en de redirect van http naar https toe.

server {
    listen 80;
    listen [::]:80;
    server_name poetsploeg.thomasklaassen.nl;

    root /var/www/poetsploeg/public;
    index index.php;
    charset utf-8;
    client_max_body_size 10m;

    access_log /var/log/nginx/poetsploeg.access.log;
    error_log  /var/log/nginx/poetsploeg.error.log;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Gebouwde assets lang cachen (bestandsnamen bevatten een hash).
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/poetsploeg.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Verborgen bestanden (.env, .git, ...) nooit uitleveren.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
