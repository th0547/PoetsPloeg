name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: Lint en tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, intl
          coverage: none

      - name: Composer-pakketten
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Assets bouwen
        run: npm ci && npm run build

      - name: Tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  server:
    name: Serverscripts en compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Scripts die op de server draaien staan in git en worden hier minstens op syntax
      # nagekeken; shellcheck vangt de klassieke fouten (ongequote variabelen e.d.).
      - name: bash -n en shellcheck
        run: |
          bestanden=(scripts/server/*.sh infra/server/poetsploeg-ontvang)
          for f in "${bestanden[@]}"; do bash -n "$f"; done
          shellcheck -x "${bestanden[@]}"

      # infra/cloud-init.yaml bevat een kopie van het ontvangstscript; die mag niet verouderen.
      - name: cloud-init bevat het actuele ontvangstscript
        run: |
          python3 - <<'PY'
          import sys, yaml
          d = yaml.safe_load(open("infra/cloud-init.yaml"))
          kopie = next(f["content"] for f in d["write_files"] if f["path"] == "/usr/local/sbin/poetsploeg-ontvang")
          sys.exit(0 if kopie == open("infra/server/poetsploeg-ontvang").read() else "cloud-init wijkt af van infra/server/poetsploeg-ontvang")
          PY

      - name: Compose-config
        run: |
          # Lege verplichte waarden laten `config` falen; vul ze voor deze controle met nep.
          sed -e 's/^\(APP_KEY\|DB_PASSWORD\|DB_ROOT_PASSWORD\)=$/\1=nep/' infra/env.productie.voorbeeld > /tmp/ci.env
          POETSPLOEG_ENV=/tmp/ci.env docker compose -f infra/compose.yaml \
            --env-file /tmp/ci.env --env-file infra/productie.env config --quiet

      - name: Caddyfile valideren
        run: |
          docker run --rm -e POETSPLOEG_DOMEIN=poetsploeg.example \
            -v "$PWD/docker/productie/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      # Bouwen zoals op de server: vanuit `git archive`, uitgepakt met umask 027 (zoals
      # poetsploeg-ontvang doet). Vanuit de checkout ging het goed, op de server niet: php-fpm
      # kon zijn configuratie niet lezen (bestanden 640).
      - name: Productie-images bouwen (zoals op de server)
        run: |
          mkdir /tmp/release
          git archive --format=tar HEAD | (umask 027 && tar -x --no-same-owner -C /tmp/release)
          cd /tmp/release
          docker build -f docker/productie/Dockerfile --target app --build-arg POETSPLOEG_COMMIT="$GITHUB_SHA" -t poetsploeg-app:ci .
          docker build -f docker/productie/Dockerfile --target web -t poetsploeg-web:ci .

      - name: Image bevat de commit
        run: test "$(docker run --rm --entrypoint printenv poetsploeg-app:ci POETSPLOEG_COMMIT)" = "$GITHUB_SHA"

      # Als www-data (zoals in productie): configuratie leesbaar en geldig, code leesbaar.
      - name: php-fpm-config en rechten in de image
        run: |
          docker run --rm --entrypoint php-fpm poetsploeg-app:ci -t
          docker run --rm --entrypoint sh poetsploeg-app:ci -c 'php -r "exit(ini_get(\"opcache.validate_timestamps\") === \"0\" ? 0 : 1);" && test -r artisan && test -r public/index.php && test -r vendor/autoload.php && test -w storage/logs'
          docker run --rm --entrypoint caddy -e POETSPLOEG_DOMEIN=poetsploeg.example poetsploeg-web:ci validate --config /etc/caddy/Caddyfile --adapter caddyfile
