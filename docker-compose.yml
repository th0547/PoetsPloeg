# Alleen voor lokaal testen. Start met:  docker compose up -d
# Daarna eenmalig:                       docker compose exec app php artisan migrate --seed
# Open http://localhost:8080 en log in met planner@novon.test / password
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - .:/var/www/novon
      # vendor en node_modules in Docker-volumes: veel sneller dan in de (Windows-)projectmap.
      - vendor:/var/www/novon/vendor
      - node_modules:/var/www/novon/node_modules
    environment:
      NOVON_ROLE: app
      COMPOSER_PROCESS_TIMEOUT: 1800
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/novon:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - .:/var/www/novon
      - vendor:/var/www/novon/vendor
    environment:
      NOVON_ROLE: scheduler
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      - app

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: novon
      MYSQL_USER: novon
      MYSQL_PASSWORD: novon
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "33060:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

volumes:
  dbdata:
  vendor:
  node_modules:
